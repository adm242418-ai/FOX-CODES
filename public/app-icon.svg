<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c071a" />
      <stop offset="50%" stop-color="#180e2e" />
      <stop offset="100%" stop-color="#06040a" />
    </linearGradient>
    <linearGradient id="neonFox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle for Android adaptive icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#a855f7" stroke-width="8" />

  <!-- Luxury glowing frame -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(168, 85, 247, 0.3)" stroke-width="4" />

  <!-- Geometric Luxury Fox Head -->
  <g transform="translate(56, 40) scale(4)" filter="url(#neonGlow)">
    <!-- Base Head -->
    <polygon points="50,15 15,45 28,88 50,72 72,88 85,45" fill="url(#neonFox)" stroke="#e9d5ff" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Left ear -->
    <polygon points="20,40 10,12 38,28" fill="#581c87" stroke="#c084fc" stroke-width="1" />
    <polygon points="18,34 13,17 32,26" fill="#a855f7" />
    <!-- Right ear -->
    <polygon points="80,40 90,12 62,28" fill="#581c87" stroke="#c084fc" stroke-width="1" />
    <polygon points="82,34 87,17 68,26" fill="#a855f7" />
    <!-- Center Muzzle -->
    <polygon points="50,15 35,45 50,65 65,45" fill="#3b0764" stroke="#c084fc" stroke-width="1" />
    <!-- Glowing Eyes -->
    <polygon points="32,48 44,48 38,55" fill="#f43f5e" />
    <polygon points="68,48 56,48 62,55" fill="#f43f5e" />
    <!-- Snout -->
    <polygon points="50,68 44,76 56,76" fill="#f3e8ff" />
  </g>

  <!-- Badge Text: FOX CODES -->
  <text x="256" y="460" font-family="'Cairo', sans-serif, system-ui" font-weight="900" font-size="44" fill="#f3e8ff" text-anchor="middle" letter-spacing="4">
    FOX CODES
  </text>
</svg>
